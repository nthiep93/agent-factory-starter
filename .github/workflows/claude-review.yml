name: Claude review

# Reviews every non-draft PR once when it opens or becomes ready, including
# PRs Claude wrote. Push more commits and want another pass? Comment
# "@claude review again". The review comments; it never approves or merges.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR against the linked issue or the PR description, and against
            AGENTS.md and .claude/rules/. Read the diff with `gh pr diff`.

            Report only problems that affect correctness, security or the stated
            requirements:
            - a requirement that is missing or only partly done
            - behaviour changes without a test, or tests weakened or deleted
            - broken repo conventions that will cause bugs (shared types outside
              packages/shared, CommonJS-style imports in apps/api, hard-coded hosts)
            - secrets, unsafe input handling, or edits to .github/, .claude/ or holdout/

            Use inline comments for specific lines. End with one summary comment:
            either "No blocking issues" or a numbered list of blocking issues.
            Skip style and naming nits.
          # default mode: only the tools listed below can run, so the reviewer
          # can comment but cannot approve, merge or push.
          claude_args: |
            --permission-mode default
            --max-turns 20
            --disallowedTools "Bash(gh pr review:*),Bash(gh pr merge:*),Edit,Write"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
