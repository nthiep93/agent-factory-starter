name: PR risk

# Labels every PR risk:low / risk:medium / risk:high (rules: docs/gates.md,
# code: packages/factory/src/risk) and, only when explicitly enabled, turns on
# auto-merge for low-risk PRs from Claude's claude/* branches.
#
# SECURITY
# - Trigger is pull_request_target, not pull_request. With pull_request the
#   workflow file itself is taken from the PR, so a PR could edit this file to
#   label itself low. pull_request_target always runs this file from the base
#   branch.
# - pull_request_target has a write token, so this workflow must NEVER check
#   out or run code from the PR head. The classifier is checked out at
#   github.event.pull_request.base.sha; the PR is only read through the API
#   (its file list), as data.
# - Head branch names and file names are attacker-controlled text: they are
#   passed through env or files, never interpolated into a script, and the
#   classifier output is printed inside ::stop-commands:: so a file name like
#   "a.md\n::set-output ..." cannot run a workflow command.
# - GH_TOKEN is set only on steps that call gh, never on install/build, so
#   dependency lifecycle scripts never see it.
# - Fail closed: auto-merge is switched off first on every run and only the
#   auto-merge job turns it back on, for this exact head commit.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      level: ${{ steps.classify.outputs.level }}
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Every new push or reopen starts from "not auto-merging". Only the
      # auto-merge job below re-enables it, and only when this run says low.
      - name: Disable auto-merge (fail closed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --disable-auto "$PR_NUMBER" || true

      - name: Check out the classifier from the BASE commit (never the PR head)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter @repo/factory

      - name: Fetch changed files and diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/files.json"
          # The unified diff shows what the file list hides: symlinks and mode
          # changes. If GitHub cannot produce it (very large PRs), fail closed.
          if gh api -H "Accept: application/vnd.github.diff" "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.diff"; then
            echo "ok" > "$RUNNER_TEMP/diff-status"
          else
            echo "unavailable" > "$RUNNER_TEMP/diff-status"
          fi

      - name: Classify
        id: classify
        env:
          # The files endpoint stops at 3000 entries; the count must match.
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          flags=(--expected-count "$CHANGED")
          if [ "$(cat "$RUNNER_TEMP/diff-status")" != ok ] ||
             grep -qE '^(new file mode 120000|deleted file mode 120000|old mode |new mode |index [0-9a-f]+\.\.[0-9a-f]+ 120000)' "$RUNNER_TEMP/pr.diff"; then
            flags+=(--mode-change)
          fi
          node scripts/classify-pr.mjs "$RUNNER_TEMP/files.json" "${flags[@]}" > "$RUNNER_TEMP/risk.txt"
          level="$(head -n 1 "$RUNNER_TEMP/risk.txt")"
          case "$level" in low|medium|high) ;; *) echo "::error::unexpected classifier output"; exit 1 ;; esac
          echo "level=$level" >> "$GITHUB_OUTPUT"
          {
            echo "### PR risk: \`$level\`"
            echo
            tail -n +2 "$RUNNER_TEMP/risk.txt" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          # Reasons contain PR file names: print them with workflow commands off.
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$token"
          cat "$RUNNER_TEMP/risk.txt"
          echo "::$token::"

      - name: Set exactly one risk label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEVEL: ${{ steps.classify.outputs.level }}
        run: |
          gh label create risk:low --color 0e8a16 --description "Docs/tests only, small" --force
          gh label create risk:medium --color fbca04 --description "App source, lockfile or shared contract" --force
          gh label create risk:high --color b60205 --description "Guardrails, config, sensitive area, deleted tests or very large" --force
          for other in low medium high; do
            [ "$other" = "$LEVEL" ] && continue
            # 404 when the label is not on the PR; that is fine.
            gh api -X DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/risk%3A$other" > /dev/null 2>&1 || true
          done
          gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/labels" -f "labels[]=risk:$LEVEL" > /dev/null

  auto-merge:
    # Off by default. All of these must hold:
    # - the classifier says low,
    # - the repo variable AUTO_MERGE_LOW_RISK is exactly 'true',
    # - the branch is a claude/* branch in this repo (not a fork), PR not draft.
    needs: risk
    if: >-
      needs.risk.outputs.level == 'low' &&
      vars.AUTO_MERGE_LOW_RISK == 'true' &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Requires the repo setting "Allow auto-merge" (Settings > General).
      # Auto-merge still waits for every required status check and review
      # rule on main (verify, holdout, ...); it only removes the click.
      # --match-head-commit ties it to the commit that was classified: if the
      # head moved after classification, enabling fails instead of approving
      # unclassified commits. A later push re-runs the risk job, whose first
      # step switches auto-merge off again.
      # A merge made with GITHUB_TOKEN does not trigger other workflows (no CI
      # run on the push to main). Vercel deploys through its own GitHub App, so
      # production still deploys.
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_NUMBER"
