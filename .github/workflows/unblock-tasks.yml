name: Unblock tasks

# Issues labeled `waiting-on-deps` (risk:low or risk:medium) whose "- Depends on #N"
# issues are all closed as completed get `ready-for-agent` instead, plus a comment.
# Runs when an issue closes, when an issue gets `waiting-on-deps` (its deps may
# already be closed at creation), and on demand from the Actions tab.
#
# This workflow never adds the `agent` label, for two reasons:
#   - Labels added with GITHUB_TOKEN do not trigger other workflows, so it could
#     not start claude.yml anyway.
#   - Dispatching stays a human decision: a maintainer reviews the issue (its
#     dependencies just changed the code it builds on) and adds `agent`.
#
# Issue bodies are untrusted. They never reach a shell: scripts/unblock-tasks.mjs
# reads them from gh's JSON output and only extracts issue numbers.

on:
  issues:
    types: [closed, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  unblock:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'closed' ||
      (github.event.action == 'labeled' && github.event.label.name == 'waiting-on-deps')
    # One run at a time so two closes in a row do not race on the same labels.
    concurrency:
      group: unblock-tasks
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Default branch, not the event's ref: run reviewed code only.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter @repo/factory

      - name: Move ready tasks to ready-for-agent
        run: node scripts/unblock-tasks.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
